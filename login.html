<!DOCTYPE html>
<html>

<head>

    <title>MenoCare - Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Navigation -->

    <nav>

        <div class="logo">
            🌸 MenoCare
        </div>


        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="symptoms.html">Symptoms</a>

            <a href="timeline.html">Timeline</a>

            <a href="period.html">Period Tracker</a>

            <a href="reports.html">Reports</a>

            <a href="chatbot.html">Ask Meno</a>

        </div>

    </nav>



    <!-- Login Container -->

    <section class="login-container">


        <div class="login-card">


            <div class="login-icon">
                🌸
            </div>


            <h1>
                Welcome to MenoCare
            </h1>


            <p>
                Create an account or login to access
                your personal health information.
            </p>



            <!-- ==============================
                 REGISTER
                 ============================== -->

            <h2>
                Create Account
            </h2>


            <input
                type="text"
                id="registerName"
                placeholder="Your name"
            >


            <input
                type="email"
                id="registerEmail"
                placeholder="Email address"
            >


            <input
                type="password"
                id="registerPassword"
                placeholder="Password"
            >


            <button
                id="registerButton"
                class="login-main-btn"
            >
                Create Account
            </button>



            <hr>



            <!-- ==============================
                 LOGIN
                 ============================== -->

            <h2>
                Login
            </h2>


            <input
                type="email"
                id="loginEmail"
                placeholder="Email address"
            >


            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >


            <button
                id="loginButton"
                class="login-main-btn"
            >
                Login
            </button>


            <!-- Message -->

            <p
                id="loginMessage"
                class="login-message"
            ></p>


        </div>

    </section>



    <!-- Footer -->

    <footer>

        <div class="footer-logo">
            🌸 MenoCare
        </div>

        <p>
            Understand your body. Track your journey.
        </p>

    </footer>



    <!-- JavaScript -->

   <script src="script.js"></script>
<script src="login.js"></script>

</body>
</html>
